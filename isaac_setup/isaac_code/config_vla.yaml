suction:
  mode: learned
  attach_xy_tolerance_m: 0.06
  attach_z_tolerance_m: 0.02
  release_max_z_m: 0.1
  release_inside_margin_m: 0.0
  rest_z_in_box_m: 0.0524
  learned_on_threshold: 0.6
  learned_off_threshold: 0.05
  learned_safety_gate: true
  box_xy: [0.39, -0.01]          # Aiming for the exact center
  box_release_radius_m: 0.03 # Strict 2cm radius to force a perfect drop

visualization:
  observer:
    enabled: true
    eye:
    - 1.25
    - -1.05
    - 0.95
    target:
    - 0.38
    - -0.18
    - 0.08
    hfov_deg: 55
    wh:
    - 960
    - 720
logging:
  run_dir: /tmp/tomo_idp3_isaac_runs
  save_frames_every: 1
  save_depth_npy: false
motion:
  motion_map_path: model/1.0.0/motion_map.npz
  grasp_offset_m:
  - 0.00414
  - 0.14384
  - 0.1989
  grasp_tolerance_m: 0.05
  delta_clamp_rad: 0.15
safety:
  workspace_x_m:
  - 0.2
  - 0.9
  workspace_y_m:
  - -0.6
  - 0.6
  workspace_z_m:
  - -0.1
  - 0.5
  early_abort_frame: 170
checkpoints:
  max_size: 64
vla_policy:
  adapter: ../act_adapter/tomo_vla_adapter.py
  checkpoint: ../../model_2/best.pt
  language_bank: ../../model/siglip_language_bank.pt
  device: cuda:0
  text_device: cpu
  text_model: google/siglip-base-patch16-224
  local_files_only: true
  host: 127.0.0.1
  port: 6081
  authkey: tomo-vla
  replan_every: 8
  inference_seed: 12345
  done_threshold: 0.6
  default_instruction: pick up the phone and put it in the box
